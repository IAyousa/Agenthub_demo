spring:
  config:
    import: optional:classpath:application-secret.yml
  application:
    name: agenthub
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  datasource:
    url: jdbc:h2:file:./shared-data/agenthub;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 8080

# Agent 服务地址
agent:
  service:
    url: http://localhost:8000
    timeout: 120000

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:5173

# 产物存储路径
artifact:
  storage:
    path: ./artifacts

# JWT 配置（敏感值见 application-secret.yml.example，复制后填入真实 secret）
jwt:
  secret: ${JWT_SECRET:agent-hub-dev-jwt-secret-key-for-jjwt-256bit}
  expiration: ${JWT_EXPIRATION:86400000}
