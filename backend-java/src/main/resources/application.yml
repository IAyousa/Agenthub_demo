spring:
  application:
    name: agenthub
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  datasource:
    url: jdbc:h2:file:./shared-data/agenthub;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Agent 服务地址
agent:
  service:
    url: http://localhost:8000
    timeout: 120000

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:5173

# 产物存储路径
artifact:
  storage:
    path: ./artifacts
