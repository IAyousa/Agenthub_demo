# AgentHub Frontend — Nginx Configuration
# SPA fallback + API reverse proxy

server {
    listen 80;
    server_name _;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # SPA fallback: 所有非文件路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代到 Java 后端
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 产物资源反代
    location /artifacts/ {
        proxy_pass http://backend:8080/artifacts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 会话下载反代
    location /conversations/ {
        proxy_pass http://backend:8080/conversations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 反代（STOMP）
    location /ws-chat/ {
        proxy_pass http://backend:8080/ws-chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Auth 反代
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # H2 控制台（调试用，生产可移除）
    location /h2-console/ {
        proxy_pass http://backend:8080/h2-console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
